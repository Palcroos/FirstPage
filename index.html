<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="imagenes/cal.png" type="image/png">
    <title>Calculadora</title>
</head>
<body>
    <header class="titulo">
        <th>Calculadora</th>
    </header>
    <table class="calculadora", border="0">
            <tr>
                <td id="celda" colspan="4"></td>
            </tr>
            <tr>
                <td><button class="boton" class="borrar">C</button></td>
                <td colspan="2"></td>
                <td><button class="operador"  data-op="/">/</button></td>
            </tr>
            <tr>
                <td><button class="boton" value=7 data-num="siete">7</button></td>
                <td><button class="boton"  value=8 data-num="ocho">8</button></td>
                <td><button class="boton"  value=9 data-num="nueve">9</button></td>
                <td><button class="operador"  data-op="x">x</button></td>
            </tr>
            <tr>
                <td><button class="boton"  value=4 data-num="cuatro">4</button></td>
                <td><button class="boton"  value=5 data-num="cinco">5</button></td>
                <td><button class="boton"  value=6 data-num="seis">6</button></td>
                <td><button class="operador"  data-op="-">--</button></td>
            </tr>
            <tr>
                <td><button class="boton"  value=1 data-num="uno">1</button></td>
                <td><button class="boton"  value=2 data-num="dos">2</button></td>
                <td><button class="boton"  value=3 data-num="tres">3</button></td>
                <td><button class="operador"  data-op="+">+</button></td>
            </tr>
            <tr>
                <td colspan="2"><button class="boton" id="cero" value=0 data-num="cero">0</button></td>
                <td><button class="boton" >.</button></td>
                <td><button class="operador"  data-op="igual">=</button></td>
            </tr>
    </table>
    <script src="javas.js"></script>
</body>
</html>
